name: Compilar EjemploSwing2
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar y empaquetar
        run: |
          javac EjemploSwing2.java
          echo "Main-Class: EjemploSwing2" > manifest.txt
          jar cfm EjemploSwing2.jar manifest.txt EjemploSwing2*.class

      - uses: actions/upload-artifact@v4
        with:
          name: EjemploSwing2-jar
          path: EjemploSwing2.jar
